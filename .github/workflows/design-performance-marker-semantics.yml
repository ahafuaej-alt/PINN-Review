name: Apply Design Performance marker semantics

on:
  push:
    branches:
      - fix/design-performance-marker-semantics
    paths:
      - .github/workflows/design-performance-marker-semantics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/design-performance-marker-semantics
          fetch-depth: 0

      - name: Normalize dependency marker semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source not found for {label} in {path}')
              file.write_text(text.replace(old, new, 1))

          css = 'assets/design-performance-v2.css'
          replace_once(
              css,
              ".matrix-board-v2 {\n  --dp-family-width: 150px;\n  --dp-design-width: 470px;",
              ".matrix-board-v2 {\n  --dp-family-width: 150px;\n  --dp-design-width: 470px;\n  --dp-influence-color: color-mix(in srgb, var(--ink) 72%, var(--muted));",
              'neutral influence color variable'
          )
          replace_once(
              css,
              ".dependency-matrix-v2 .influence-marker {\n  width: 16px;\n  height: 16px;\n  flex-basis: 16px;\n  border-width: 2px;\n  color: var(--cell-color);\n}",
              ".dependency-matrix-v2 .influence-marker {\n  width: 16px;\n  height: 16px;\n  flex-basis: 16px;\n  border-width: 2px;\n  color: var(--dp-influence-color);\n}\n\n/* Outcome colors identify columns only. Influence strength is encoded by marker fill. */\n.dependency-matrix.dependency-matrix-v2 td .influence-marker,\n.matrix-board-v2 .dp-mobile-view .influence-marker,\n.matrix-board-v2 .dp-matrix-legend .influence-marker {\n  color: var(--dp-influence-color);\n}",
              'matrix marker color rule'
          )

          js = 'assets/design-performance-v2.js'
          replace_once(
              js,
              '<aside class="dp-scientific-notes"><b>Scientific interpretation</b><span>Qualitative synthesis, not effect-size estimation.</span><span>Dependency strength is problem-, formulation-, and implementation-dependent.</span><span>Verify performance claims with appropriate metrics and failure diagnostics.</span></aside>',
              '<aside class="dp-scientific-notes"><b>Scientific interpretation</b><span>Qualitative synthesis, not effect-size estimation.</span><span>Dependency strength is problem-, formulation-, and implementation-dependent.</span><span>Outcome colors identify columns; marker fill—not marker color—encodes dependency strength.</span><span>Verify performance claims with appropriate metrics and failure diagnostics.</span></aside>',
              'scientific interpretation note'
          )
          replace_once(
              js,
              'const width = 2480, familyW = 170, designW = 500, colW = (width - familyW - designW - 80) / 7, margin = 40, headerY = 118, headerH = 180, rowH = 92, legendH = 190;',
              'const width = 2480, familyW = 170, designW = 500, colW = (width - familyW - designW - 80) / 7, margin = 40, headerY = 118, headerH = 180, rowH = 92, legendH = 220;',
              'SVG legend height'
          )
          replace_once(
              js,
              "const colors = { accuracy: '#1747b8', fidelity: '#14763a', trainability: '#eb5a16', cost: '#5632aa', robustness: '#087a9c', identifiability: '#263dbe', scalability: '#b8125e', representation: '#1747b8', 'physics-numerics': '#14763a', training: '#eb5a16', extension: '#5632aa' };",
              "const colors = { accuracy: '#1747b8', fidelity: '#14763a', trainability: '#eb5a16', cost: '#5632aa', robustness: '#087a9c', identifiability: '#263dbe', scalability: '#b8125e', representation: '#1747b8', 'physics-numerics': '#14763a', training: '#eb5a16', extension: '#5632aa' };\n    const dependencyColor = dark ? '#d2d9e5' : '#344357';",
              'SVG neutral dependency color'
          )
          replace_once(
              js,
              'const column = state.data.columns[colIndex], x = margin + familyW + designW + colIndex * colW, color = colors[column.id];',
              'const column = state.data.columns[colIndex], x = margin + familyW + designW + colIndex * colW;',
              'remove column color from SVG dependency cell'
          )
          replace_once(
              js,
              '${svgMarker(x + colW / 2, y + 29, cell.level, color)}',
              '${svgMarker(x + colW / 2, y + 29, cell.level, dependencyColor)}',
              'SVG cell neutral marker'
          )
          old_legend = '''pieces.push(`<line x1="${margin}" y1="${y + 28}" x2="${width - margin}" y2="${y + 28}" stroke="${line}"/><text x="${margin}" y="${y + 66}" font-size="18" class="b">QUALITATIVE INFLUENCE LEVEL</text>${svgMarker(margin + 310, y + 60, 'major', '#1747b8')}<text x="${margin + 335}" y="${y + 66}" class="s">Direct / major</text>${svgMarker(margin + 570, y + 60, 'context', '#1747b8')}<text x="${margin + 595}" y="${y + 66}" class="s">Context-dependent</text>${svgMarker(margin + 900, y + 60, 'indirect', '#1747b8')}<text x="${margin + 925}" y="${y + 66}" class="s">Indirect / secondary</text><text x="${margin + 1240}" y="${y + 66}" font-size="24" fill="#c9322c" class="b">↕</text><text x="${margin + 1270}" y="${y + 66}" class="s">Explicit outcome-pair trade-off</text>`);'''
          new_legend = '''pieces.push(`<line x1="${margin}" y1="${y + 28}" x2="${width - margin}" y2="${y + 28}" stroke="${line}"/><text x="${margin}" y="${y + 66}" font-size="18" class="b">QUALITATIVE INFLUENCE LEVEL</text>${svgMarker(margin + 310, y + 60, 'major', dependencyColor)}<text x="${margin + 335}" y="${y + 66}" class="s">Direct / major</text>${svgMarker(margin + 570, y + 60, 'context', dependencyColor)}<text x="${margin + 595}" y="${y + 66}" class="s">Context-dependent</text>${svgMarker(margin + 900, y + 60, 'indirect', dependencyColor)}<text x="${margin + 925}" y="${y + 66}" class="s">Indirect / secondary</text><text x="${margin + 1240}" y="${y + 66}" font-size="24" fill="#c9322c" class="b">↕</text><text x="${margin + 1270}" y="${y + 66}" class="s">Explicit outcome-pair trade-off</text>`);'''
          replace_once(js, old_legend, new_legend, 'SVG legend marker semantics')
          old_notes = '''pieces.push(`<text x="${margin}" y="${y + 116}" class="xs m">NOTES · Qualitative synthesis, not effect-size estimation. Dependency strength varies by problem, formulation, and implementation.</text><text x="${margin}" y="${y + 144}" class="xs m">Evidence coverage distinguishes exact cell support from row-level synthesis; it is not an influence-strength scale.</text><text x="${margin}" y="${y + 172}" class="xs m">Verify design consequences using appropriate performance metrics and failure diagnostics.</text></svg>`);'''
          new_notes = '''pieces.push(`<text x="${margin}" y="${y + 116}" class="xs m">NOTES · Qualitative synthesis, not effect-size estimation. Dependency strength varies by problem, formulation, and implementation.</text><text x="${margin}" y="${y + 144}" class="xs m">Marker fill, not color, encodes dependency strength; outcome colors identify columns only.</text><text x="${margin}" y="${y + 172}" class="xs m">Evidence coverage distinguishes exact cell support from row-level synthesis; it is not an influence-strength scale.</text><text x="${margin}" y="${y + 200}" class="xs m">Verify design consequences using appropriate performance metrics and failure diagnostics.</text></svg>`);'''
          replace_once(js, old_notes, new_notes, 'SVG scientific notes')

          qa = 'scripts/visual-qa-design-performance-v2.mjs'
          old_assert = "assert(contract.workbench && contract.mobileView && contract.notes, 'Workbench, mobile representation, or scientific notes are missing.');"
          new_assert = """assert(contract.workbench && contract.mobileView && contract.notes, 'Workbench, mobile representation, or scientific notes are missing.');\n\n  const markerColors = await page.evaluate(() => [...new Set([...document.querySelectorAll('.dependency-matrix-v2 tbody .influence-marker')].map((node) => getComputedStyle(node).color))]);\n  assert(markerColors.length === 1, `Dependency markers must use one neutral semantic color across outcome columns; found ${markerColors.join(', ')}.`);\n  const scientificNotes = (await page.locator('.dp-scientific-notes').innerText()).toLowerCase();\n  assert(scientificNotes.includes('marker fill') && scientificNotes.includes('outcome colors identify columns'), 'Scientific notes must explain that marker fill, not outcome color, encodes dependency strength.');"""
          replace_once(qa, old_assert, new_assert, 'browser QA neutral marker assertion')
          old_svg_assert = "assert(svg.includes('QUALITATIVE INFLUENCE LEVEL') && svg.includes('Explicit outcome-pair trade-off'), 'Publication SVG is missing integrated legend semantics.');"
          new_svg_assert = """assert(svg.includes('QUALITATIVE INFLUENCE LEVEL') && svg.includes('Explicit outcome-pair trade-off'), 'Publication SVG is missing integrated legend semantics.');\n  assert(svg.includes('Marker fill, not color, encodes dependency strength'), 'Publication SVG is missing neutral dependency-marker semantics.');"""
          replace_once(qa, old_svg_assert, new_svg_assert, 'SVG QA semantics assertion')

          html = 'frameworks/design-performance/index.html'
          replace_once(html, 'design-performance-v2.css?v=20260827-design-performance-v2', 'design-performance-v2.css?v=20260829-design-performance-v3', 'CSS cache version')
          replace_once(html, 'design-performance-v2.js?v=20260827-design-performance-v2', 'design-performance-v2.js?v=20260829-design-performance-v3', 'JS cache version')
          PY

      - name: Run focused validation
        run: |
          node --check assets/design-performance-v2.js
          node --check scripts/visual-qa-design-performance-v2.mjs
          node scripts/validate-frameworks.mjs
          node scripts/audit-design-performance.mjs
          node scripts/validate-navigation.mjs
          grep -F -- "--dp-influence-color" assets/design-performance-v2.css
          grep -F "Marker fill, not color, encodes dependency strength" assets/design-performance-v2.js
          grep -F "markerColors.length === 1" scripts/visual-qa-design-performance-v2.mjs

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/design-performance-marker-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/design-performance-v2.css assets/design-performance-v2.js frameworks/design-performance/index.html scripts/visual-qa-design-performance-v2.mjs
          git diff --cached --check
          git commit -m "fix: use semantic dependency markers in design matrix"
          git push origin HEAD:fix/design-performance-marker-semantics
