name: Patch bibliographic concept-link scope

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reference-prose-concept-links
    paths:
      - '.github/workflows/patch-reference-prose-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-prose-concept-links
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped guard
        run: python scripts/patch-reference-prose-links.py
      - name: Validate static concept contracts
        run: |
          node scripts/build-concept-registry.mjs
          node scripts/apply-canonical-mappings.mjs
          node scripts/validate-concepts.mjs
          git restore data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json
      - name: Commit scoped guard
        run: |
          git add assets/concepts.js scripts/visual-qa-concept-regressions.mjs scripts/validate-concepts.mjs
          if git diff --cached --quiet; then
            echo 'Bibliographic prose guard already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prevent concept links in bibliographic prose'
          git push origin HEAD:fix/reference-prose-concept-links
