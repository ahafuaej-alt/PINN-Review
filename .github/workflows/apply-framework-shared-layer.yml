name: Framework shared-layer QA

on:
  push:
    branches:
      - feat/frameworks-shared-interactions
    paths:
      - '.github/workflows/apply-framework-shared-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frameworks-shared-interactions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Framework contracts
        run: |
          node scripts/build-concept-registry.mjs
          node scripts/apply-canonical-mappings.mjs
          node scripts/validate-frameworks.mjs
          node scripts/validate-navigation.mjs
      - name: Locate Chromium
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-framework-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Run Framework browser QA
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-framework-qa/node_modules/playwright-core/index.mjs
          BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 >/tmp/pinn-framework-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/visual-qa-frameworks.mjs
