name: Apply Framework shared layer

on:
  push:
    branches:
      - feat/frameworks-shared-interactions
    paths:
      - '.github/workflows/apply-framework-shared-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frameworks-shared-interactions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared Framework contracts
        run: python scripts/apply-framework-shared-layer.py
      - name: Validate static Framework contracts
        run: |
          node scripts/build-concept-registry.mjs
          node scripts/apply-canonical-mappings.mjs
          node scripts/validate-frameworks.mjs
          node scripts/validate-navigation.mjs
          git restore data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json
      - name: Commit Framework shared layer
        run: |
          git add assets/frameworks.js assets/frameworks.css assets/framework-icons.svg frameworks/index.html frameworks/design-stack/index.html frameworks/co-design/index.html frameworks/design-performance/index.html frameworks/failure-diagnostics/index.html scripts/validate-frameworks.mjs scripts/visual-qa-frameworks.mjs
          if git diff --cached --quiet; then
            echo 'Framework shared layer already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Standardize Framework interaction and evidence contracts'
          git push origin HEAD:feat/frameworks-shared-interactions
