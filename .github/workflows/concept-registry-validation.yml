name: Concept registry validation

on:
  pull_request:
    paths:
      - 'assets/app.js'
      - 'assets/concepts.*'
      - 'assets/frameworks.js'
      - 'assets/mathematical-formulations.js'
      - 'assets/optimizers.js'
      - 'assets/activation-functions.js'
      - 'assets/performance.js'
      - 'assets/pinn-ecosystem.js'
      - 'assets/reference-technical-details.js'
      - 'data/concepts/**'
      - 'data/frameworks/**'
      - 'data/mathematical-formulations/**'
      - 'data/optimizers/**'
      - 'data/activation-functions/**'
      - 'data/performance/**'
      - 'data/pinn-ecosystem/**'
      - 'frameworks/design-stack/index.html'
      - 'mathematical-formulations/index.html'
      - 'performance-metrics/index.html'
      - 'scripts/audit-canonical-concepts.mjs'
      - 'scripts/build-concept-registry.mjs'
      - 'scripts/migrate-framework-concepts.mjs'
      - 'scripts/validate-concepts.mjs'
      - 'scripts/visual-qa-concept-regressions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated concept data is current
        run: |
          cp data/concepts/registry.json /tmp/registry.json
          cp data/concepts/core.json /tmp/core.json
          cp data/concepts/evidence-relationships.json /tmp/evidence-relationships.json
          node scripts/build-concept-registry.mjs
          cmp data/concepts/registry.json /tmp/registry.json
          cmp data/concepts/core.json /tmp/core.json
          cmp data/concepts/evidence-relationships.json /tmp/evidence-relationships.json
      - name: Audit canonical concept coverage
        run: node scripts/audit-canonical-concepts.mjs
      - run: node scripts/validate-concepts.mjs
      - run: node scripts/validate-frameworks.mjs
      - run: node scripts/validate-navigation.mjs
      - name: Locate Chromium
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-concept-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Run concept runtime regression QA
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-concept-qa/node_modules/playwright-core/index.mjs
          BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 >/tmp/pinn-concept-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/visual-qa-concept-regressions.mjs
