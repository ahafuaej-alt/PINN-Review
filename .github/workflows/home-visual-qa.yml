name: Atlas homepage visual QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/home-refresh.css'
      - 'assets/home-refresh.js'
      - 'assets/styles.css'
      - 'assets/theme-init.js'
      - 'data/atlas-overview.json'
      - 'data/site-reach.json'
      - 'scripts/validate-home.mjs'
      - '.github/workflows/home-visual-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/home-refresh.css'
      - 'assets/home-refresh.js'
      - 'assets/styles.css'
      - 'assets/theme-init.js'
      - 'data/atlas-overview.json'
      - 'data/site-reach.json'
      - 'scripts/validate-home.mjs'
      - '.github/workflows/home-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-homepage-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate homepage static contract
        run: |
          node scripts/build-atlas-overview.mjs --check
          node scripts/build-site-index.mjs --check
          node --check assets/home-refresh.js
          node scripts/validate-home.mjs
      - name: Locate runner browser
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-home-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinn-home-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pinn-home-preview.log
          exit 1
      - name: Validate homepage rendering and responsive layout
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-home-qa/node_modules/playwright-core/index.mjs
        run: node scripts/validate-home.mjs --browser
      - name: Stop static preview
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true
