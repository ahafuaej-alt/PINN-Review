name: Regenerate concept registry

on:
  push:
    branches:
      - feat/canonical-concept-mapping
    paths:
      - 'data/concepts/canonical-mappings.json'
      - 'scripts/apply-canonical-mappings.mjs'
      - 'scripts/build-concept-registry.mjs'
      - '.github/workflows/regenerate-concept-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-concept-mapping
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical concept data
        run: |
          node scripts/build-concept-registry.mjs
          node scripts/apply-canonical-mappings.mjs
          node scripts/audit-canonical-concepts.mjs --strict
          node scripts/validate-concepts.mjs
      - name: Commit generated registry
        run: |
          if git diff --quiet -- data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json; then
            echo 'Generated concept registry is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json
          git commit -m 'data: regenerate canonical concept registry'
          git push origin HEAD:feat/canonical-concept-mapping
