name: Regenerate concept registry

on:
  push:
    branches:
      - fix/canonical-context-precision
    paths:
      - 'scripts/build-concept-registry.mjs'
      - 'scripts/apply-canonical-mappings.mjs'
      - '.github/workflows/regenerate-concept-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated registry snapshots
        run: node scripts/build-concept-registry.mjs
      - name: Commit generated snapshots when changed
        run: |
          git add data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json
          if git diff --cached --quiet; then
            echo 'Generated registry snapshots are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update generated concept registry'
          git push origin "HEAD:${GITHUB_REF_NAME}"
