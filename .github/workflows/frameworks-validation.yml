name: Frameworks validation

on:
  pull_request:
    paths:
      - 'frameworks/**'
      - 'assets/frameworks.*'
      - 'assets/frameworks-runtime-fixes.*'
      - 'assets/co-design-v2.*'
      - 'assets/co-design-v2-bridge.js'
      - 'assets/co-design-v2-layout.css'
      - 'assets/co-design-v2-map-fixes.css'
      - 'assets/co-design-v2.map-nav.js'
      - 'assets/co-design-v2.map-nav.css'
      - 'assets/co-design-arrange-runtime.js'
      - 'assets/co-design-arrange.css'
      - 'assets/co-design-label-layout.js'
      - 'assets/design-performance-*'
      - 'assets/failure-diagnostics-*'
      - 'data/frameworks/**'
      - 'assets/theme-init.js'
      - 'index.html'
      - 'README.md'
      - 'sitemap.xml'
      - 'scripts/validate-frameworks.mjs'
      - 'scripts/audit-design-performance.mjs'
      - 'scripts/validate-failure-diagnostics.mjs'
      - 'scripts/visual-qa-frameworks-contract.mjs'
      - 'scripts/visual-qa-framework-runtime.mjs'
      - 'scripts/visual-qa-co-design-v2.mjs'
      - 'scripts/visual-qa-co-design-arrange.mjs'
      - 'scripts/visual-qa-design-performance-v2.mjs'
      - 'scripts/visual-qa-failure-diagnostics-v2.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/frameworks-runtime-fixes.js
      - run: node --check assets/co-design-v2.js
      - run: node --check assets/co-design-v2-bridge.js
      - run: node --check assets/co-design-v2.map-nav.js
      - run: node --check assets/co-design-arrange-runtime.js
      - run: node --check assets/co-design-label-layout.js
      - run: node --check assets/design-performance-v2.js
      - run: node --check assets/design-performance-v2-layout.js
      - run: node --check assets/failure-diagnostics-v2.js
      - run: node --check scripts/audit-design-performance.mjs
      - run: node --check scripts/validate-failure-diagnostics.mjs
      - run: node --check scripts/visual-qa-frameworks-contract.mjs
      - run: node --check scripts/visual-qa-framework-runtime.mjs
      - run: node --check scripts/visual-qa-co-design-v2.mjs
      - run: node --check scripts/visual-qa-co-design-arrange.mjs
      - run: node --check scripts/visual-qa-design-performance-v2.mjs
      - run: node --check scripts/visual-qa-failure-diagnostics-v2.mjs
      - run: node scripts/validate-frameworks.mjs
      - run: node scripts/audit-design-performance.mjs
      - run: node scripts/validate-failure-diagnostics.mjs
      - run: node scripts/validate-navigation.mjs
      - run: node scripts/validate-readme.mjs
      - name: Locate Chromium
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-frameworks-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Run Frameworks browser QA
        env:
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-frameworks-qa/node_modules/playwright-core/index.mjs
          BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 >/tmp/pinn-frameworks-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/visual-qa-frameworks-contract.mjs
          node scripts/visual-qa-framework-runtime.mjs
          node scripts/visual-qa-co-design-v2.mjs
          node scripts/visual-qa-co-design-arrange.mjs
          node scripts/visual-qa-design-performance-v2.mjs
          node scripts/visual-qa-failure-diagnostics-v2.mjs
      - name: Upload Frameworks QA renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameworks-visual-qa
          path: artifacts/frameworks
          if-no-files-found: warn
