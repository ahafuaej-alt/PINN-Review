name: Deploy GitHub Pages

run-name: Deploy GitHub Pages${{ inputs.source_sha && format(' · {0}', inputs.source_sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact repository commit to deploy (defaults to the triggering commit)'
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact repository commit to deploy'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare cache-busted shared UI assets
        run: |
          source_version="${{ inputs.source_sha || github.sha }}"
          ambient_version="${source_version:0:12}"
          node scripts/prepare-shared-ui.mjs "$ambient_version"
          echo "AMBIENT_VERSION=$ambient_version" >> "$GITHUB_ENV"
      - name: Verify canonical and generated datasets
        run: |
          node scripts/build-datasets.mjs --check
          node scripts/validate-dataset.mjs
          node scripts/validate-citation-format.mjs
          node scripts/validate-pinn-realm.mjs
          node scripts/build-optimizers.mjs --check
          node scripts/build-atlas-overview.mjs --check
          node scripts/build-site-index.mjs --check
          node scripts/build-concept-registry.mjs
          node scripts/apply-canonical-mappings.mjs
          node scripts/audit-canonical-concepts.mjs --strict
          node --check assets/optimizers.js
          node --check assets/reference-technical-details.js
          node --check assets/home-refresh.js
          node --check assets/mathematical-formulations.js
          node --check assets/frameworks.js
          node --check assets/frameworks-runtime-fixes.js
          node --check assets/co-design-v2.js
          node --check assets/co-design-v2-bridge.js
          node --check assets/co-design-arrange-runtime.js
          node --check scripts/visual-qa-co-design-v2.mjs
          node --check scripts/visual-qa-co-design-arrange.mjs
          node --check assets/concepts.js
          node --check assets/theme-init.js
          node --check assets/ambient-rich.js
          node scripts/validate-optimizers.mjs
          node scripts/validate-mathematical-formulations.mjs
          node scripts/validate-frameworks.mjs
          node scripts/validate-concepts.mjs
      - name: Verify static site contracts
        run: |
          node scripts/validate-navigation.mjs
          node scripts/validate-home.mjs
          node scripts/validate-ui-refinements.mjs
          node scripts/validate-readme.mjs
          node scripts/validate-ambient-motion.mjs
      - name: Locate runner browser
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-nav-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinn-navigation-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pinn-navigation-preview.log
          exit 1
      - name: Verify navigation, homepage, formulations, and shared UI rendering
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-nav-qa/node_modules/playwright-core/index.mjs
          FRAMEWORK_QA_ARTIFACTS: /tmp/frameworks-visual-qa
        run: |
          node scripts/validate-navigation.mjs --browser
          node scripts/validate-home.mjs --browser
          node scripts/validate-mathematical-formulations.mjs --browser
          node scripts/validate-ui-refinements.mjs --browser
          node scripts/validate-ambient-motion.mjs --browser
          node scripts/visual-qa-frameworks.mjs
          node scripts/visual-qa-framework-runtime.mjs
          node scripts/visual-qa-co-design-v2.mjs
          node scripts/visual-qa-co-design-arrange.mjs
          node scripts/visual-qa-concept-regressions.mjs
      - name: Stop static preview
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
