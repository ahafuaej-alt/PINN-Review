name: Deploy GitHub Pages

run-name: Deploy GitHub Pages${{ inputs.source_sha && format(' · {0}', inputs.source_sha) || '' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact repository commit to deploy (defaults to the triggering commit)'
        required: false
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: 'Exact repository commit to deploy'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical and generated datasets
        run: |
          node scripts/build-datasets.mjs --check
          node scripts/validate-dataset.mjs
          node scripts/validate-citation-format.mjs
          node scripts/validate-pinn-realm.mjs
          node scripts/build-optimizers.mjs --check
          node --check assets/optimizers.js
          node --check assets/reference-technical-details.js
          node scripts/validate-optimizers.mjs
      - name: Verify static navigation contract
        run: node scripts/validate-navigation.mjs
      - name: Locate runner browser
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install navigation browser driver
        run: npm install --prefix /tmp/pinn-nav-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Start navigation preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinn-navigation-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pinn-navigation-preview.log
          exit 1
      - name: Verify navigation rendering and overflow
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-nav-qa/node_modules/playwright-core/index.mjs
        run: node scripts/validate-navigation.mjs --browser
      - name: Stop navigation preview
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
