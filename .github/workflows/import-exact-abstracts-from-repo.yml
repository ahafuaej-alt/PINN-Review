name: Import exact abstracts from repository

on:
  push:
    branches:
      - agent/import-exact-abstracts-from-repo-20260726
    paths:
      - data/abstract-import.ready

permissions:
  contents: write

concurrency:
  group: import-exact-abstracts-from-repo-20260726
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-exact-abstracts-from-repo-20260726
          fetch-depth: 0

      - name: Import exact abstracts and regenerate Atlas datasets
        run: node scripts/import-abstracts-from-markdown.mjs data/journal_articles_exact_abstracts_2.md

      - name: Validate canonical and generated data
        run: |
          node scripts/validate-dataset.mjs
          node scripts/build-datasets.mjs --check
          git diff --check

      - name: Commit coordinated Atlas update and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers-master.json data/references.json data/references-metadata.json data/pinn-realm.json data/changes.json
          git rm .github/workflows/import-exact-abstracts-from-repo.yml scripts/import-abstracts-from-markdown.mjs data/abstract-import.ready
          git diff --cached --quiet && { echo "No coordinated Atlas changes were staged"; exit 1; }
          git commit -m "Import 420 exact paper abstracts"
          git push origin HEAD:agent/import-exact-abstracts-from-repo-20260726
