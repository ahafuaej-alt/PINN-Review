name: Apply paper dataset update

on:
  workflow_dispatch:
    inputs:
      update_json:
        description: 'Paste the compact JSON copied from Dataset Manager'
        required: true
        type: string

permissions: {}

concurrency:
  group: canonical-dataset-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize authenticated update package
        env:
          UPDATE_JSON: ${{ inputs.update_json }}
        run: node -e "require('fs').writeFileSync('/tmp/pinn-paper-update.json', process.env.UPDATE_JSON)"
      - name: Apply, rebuild, and validate
        run: |
          node scripts/apply-paper-update.mjs /tmp/pinn-paper-update.json
          node scripts/build-datasets.mjs --check
          node scripts/validate-dataset.mjs
          node scripts/validate-citation-format.mjs
          node scripts/validate-pinn-realm.mjs
          git diff --check
      - name: Commit and integrate coordinated dataset release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers-master.json data/changes.json data/references.json data/references-metadata.json data/pinn-realm.json
          git commit -m "Update canonical paper dataset"

          release_branch="ci/dataset-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${release_branch}"

          pr_body="$(printf 'Validated canonical paper dataset release.\n\nSource workflow run: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          pr_number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title='Update canonical paper dataset' \
            -f head="$release_branch" \
            -f base='main' \
            -f body="$pr_body" \
            --jq '.number')"

          merge_response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f sha="$candidate_sha" \
            -f merge_method='merge' \
            -f commit_title='Update canonical paper dataset [skip pages]' \
            -f commit_message='Promote the validated canonical dataset through the controlled release pull request.')"
          merged="$(jq -r '.merged // false' <<< "$merge_response")"
          merge_sha="$(jq -r '.sha // empty' <<< "$merge_response")"
          if [[ "$merged" != "true" || -z "$merge_sha" ]]; then
            echo "::error::Controlled dataset integration did not merge."
            echo "$merge_response"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$merge_sha" origin/main; then
            echo "::error::Merged dataset commit is not reachable from current main."
            exit 1
          fi

          git push origin --delete "$release_branch" || echo "::warning::Merged release branch could not be deleted automatically."
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy synchronized Atlas
    needs: update
    uses: ./.github/workflows/pages.yml
    with:
      source_sha: ${{ needs.update.outputs.commit_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
