name: Regenerate Design Stack concept snapshots

on:
  push:
    branches:
      - feat/design-stack-scientific-flow
    paths:
      - '.github/workflows/regenerate-design-stack-concepts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/design-stack-scientific-flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical concept snapshots
        run: |
          node scripts/build-concept-registry.mjs
          cp data/concepts/registry.json /tmp/registry.raw.json
          cp data/concepts/core.json /tmp/core.raw.json
          cp data/concepts/evidence-relationships.json /tmp/evidence.raw.json
      - name: Validate mapped runtime state
        run: |
          node scripts/apply-canonical-mappings.mjs
          node scripts/audit-canonical-concepts.mjs --strict
          node scripts/validate-concepts.mjs
          node scripts/validate-frameworks.mjs
          node scripts/validate-navigation.mjs
      - name: Restore generator-source snapshots
        run: |
          cp /tmp/registry.raw.json data/concepts/registry.json
          cp /tmp/core.raw.json data/concepts/core.json
          cp /tmp/evidence.raw.json data/concepts/evidence-relationships.json
      - name: Commit current generated snapshots
        run: |
          git add data/concepts/registry.json data/concepts/core.json data/concepts/evidence-relationships.json
          if git diff --cached --quiet; then
            echo 'Generated concept snapshots are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate Design Stack concept snapshots'
          git push origin HEAD:feat/design-stack-scientific-flow
