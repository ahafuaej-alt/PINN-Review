name: Performance metrics validation

on:
  pull_request:
    paths:
      - 'performance-metrics/**'
      - 'references/**'
      - 'assets/performance.*'
      - 'assets/performance-fixes.*'
      - 'assets/performance-data-supplement-loader.js'
      - 'assets/reference-technical-details.*'
      - 'assets/app.js'
      - 'data/performance/**'
      - 'scripts/validate-performance-metrics.mjs'
      - '.github/workflows/performance-validation.yml'
      - 'index.html'
  push:
    branches:
      - main
    paths:
      - 'performance-metrics/**'
      - 'references/**'
      - 'assets/performance.*'
      - 'assets/performance-fixes.*'
      - 'assets/performance-data-supplement-loader.js'
      - 'assets/reference-technical-details.*'
      - 'assets/app.js'
      - 'data/performance/**'
      - 'scripts/validate-performance-metrics.mjs'
      - '.github/workflows/performance-validation.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/performance.js
          node --check assets/performance-fixes.js
          node --check assets/performance-data-supplement-loader.js
          node --check assets/reference-technical-details.js
      - name: Validate source-derived datasets
        run: node scripts/validate-performance-metrics.mjs
