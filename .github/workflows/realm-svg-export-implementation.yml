name: Apply PINN Realm SVG export UI

on:
  push:
    branches:
      - feat/realm-svg-export
    paths:
      - .github/workflows/realm-svg-export-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/realm-svg-export
          fetch-depth: 0

      - name: Add export controls and styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/realm.css')
          css = css_path.read_text()
          old = '''.realm-map-head { display: flex; justify-content: space-between; gap: 1.5rem; align-items: end; margin-bottom: .8rem; }
          .realm-map-head h2 { margin: 0; font-size: 1.05rem; }
          .realm-map-head > p { max-width: 480px; margin: 0; color: var(--faint); font-size: .72rem; text-align: right; }
          '''
          new = '''.realm-map-head { display: flex; justify-content: space-between; gap: 1.5rem; align-items: end; margin-bottom: .8rem; }
          .realm-map-head h2 { margin: 0; font-size: 1.05rem; }
          .realm-map-head-side { max-width: 540px; display: grid; gap: .48rem; justify-items: end; }
          .realm-map-head-side > p { margin: 0; color: var(--faint); font-size: .72rem; text-align: right; }
          .figure-export-actions { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; justify-content: flex-end; }
          .figure-export-label { color: var(--faint); font-family: var(--mono); font-size: .58rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
          .figure-export-button { min-height: 30px; padding: .28rem .52rem; border: 1px solid var(--line-strong); border-radius: 7px; color: var(--muted); background: var(--field); font-family: var(--mono); font-size: .58rem; font-weight: 750; cursor: pointer; }
          .figure-export-button:hover { color: var(--ink); border-color: var(--mint); background: var(--surface-hover); }
          .figure-export-button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
          .figure-export-button[data-export-variant="publication"] { color: var(--mint); }
          '''
          if old not in css:
              raise SystemExit('Expected Realm map-header CSS was not found')
          css = css.replace(old, new, 1)
          annual_old = '''.overview-chart > p:not(.eyebrow):not(.annual-chart-note) { margin: 0 0 .5rem; color: var(--faint); font-size: .7rem; }
          .annual-chart-scroll {
          '''
          annual_new = '''.overview-chart > p:not(.eyebrow):not(.annual-chart-note) { margin: 0 0 .5rem; color: var(--faint); font-size: .7rem; }
          .chart-export-actions { justify-content: flex-start; margin: .15rem 0 .45rem; }
          .annual-chart-scroll {
          '''
          if annual_old not in css:
              raise SystemExit('Expected annual-chart CSS was not found')
          css = css.replace(annual_old, annual_new, 1)
          mobile_old = '''  .realm-map-head { display: block; }
            .realm-map-head > p { margin-top: .25rem; text-align: left; }
          '''
          mobile_new = '''  .realm-map-head { display: block; }
            .realm-map-head-side { margin-top: .35rem; justify-items: start; }
            .realm-map-head-side > p { text-align: left; }
            .realm-map-head-side .figure-export-actions { justify-content: flex-start; }
          '''
          if mobile_old not in css:
              raise SystemExit('Expected mobile Realm map-header CSS was not found')
          css = css.replace(mobile_old, mobile_new, 1)
          css_path.write_text(css)

          html_path = Path('pinn-realm/index.html')
          html = html_path.read_text()
          old_css = '../assets/realm.css?v=realm-20260722b'
          if old_css not in html:
              raise SystemExit('Expected Realm CSS asset reference was not found')
          html = html.replace(old_css, '../assets/realm.css?v=realm-20260829-svg1', 1)
          old_script = '  <script src="../assets/realm.js?v=realm-20260722b" defer></script>\n'
          if old_script not in html:
              raise SystemExit('Expected Realm script reference was not found')
          html = html.replace(old_script, old_script + '  <script src="../assets/realm-export.js?v=realm-20260829-svg1" defer></script>\n', 1)
          old_head = '          <div class="realm-map-head"><div><p class="eyebrow compact">Interactive world map</p><h2 id="map-title" data-map-title>Individual-country publications</h2></div><p data-map-caption>Color represents unique papers associated with each country.</p></div>\n'
          new_head = '          <div class="realm-map-head"><div><p class="eyebrow compact">Interactive world map</p><h2 id="map-title" data-map-title>Individual-country publications</h2></div><div class="realm-map-head-side"><p data-map-caption>Color represents unique papers associated with each country.</p><div class="figure-export-actions" role="group" aria-label="Map SVG export options"><span class="figure-export-label">Export SVG</span><button type="button" class="figure-export-button" data-export-figure="map" data-export-variant="current" title="Download an SVG matching the current Atlas theme and filters">Current view</button><button type="button" class="figure-export-button" data-export-figure="map" data-export-variant="publication" title="Download a clean white-background SVG prepared for publication">Publication</button></div></div></div>\n'
          if old_head not in html:
              raise SystemExit('Expected Realm map header was not found')
          html = html.replace(old_head, new_head, 1)
          html_path.write_text(html)
          PY

      - name: Run core validation
        run: |
          node --check assets/realm.js
          node --check assets/realm-export.js
          node scripts/validate-pinn-realm.mjs
          node scripts/validate-dataset.mjs
          node scripts/validate-navigation.mjs
          grep -F 'data-export-figure="map"' pinn-realm/index.html
          grep -F 'realm-export.js?v=realm-20260829-svg1' pinn-realm/index.html
          grep -F 'chart-export-actions' assets/realm.css

      - name: Locate runner browser
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"

      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-realm-svg-qa --no-save --package-lock=false playwright-core@1.55.0

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinn-realm-svg-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/pinn-realm/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pinn-realm-svg-preview.log
          exit 1

      - name: Verify Realm SVG downloads in browser
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-realm-svg-qa/node_modules/playwright-core/index.mjs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const { chromium } = await import(process.env.PLAYWRIGHT_CORE_PATH);
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({ acceptDownloads: true, viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          await page.goto(`${process.env.BASE_URL}/pinn-realm/`, { waitUntil: 'networkidle' });
          await page.waitForSelector('.country-shape.has-source-data');
          await page.waitForSelector('[data-realm-export-actions="annual"]');

          assert(await page.locator('.realm-map-head [data-export-figure="map"]').count() === 2, 'Map must expose two SVG export modes');
          assert(await page.locator('.overview-chart [data-realm-export-actions="annual"] [data-export-figure="annual"]').count() === 2, 'Global annual chart must expose two SVG export modes');

          const downloadSvg = async (selector) => {
            const [download] = await Promise.all([
              page.waitForEvent('download'),
              page.locator(selector).click()
            ]);
            const path = await download.path();
            assert(path, `No download path for ${selector}`);
            const svg = await fs.readFile(path, 'utf8');
            assert(download.suggestedFilename().endsWith('.svg'), `Expected SVG filename for ${selector}`);
            assert(svg.startsWith('<?xml version="1.0"'), `Expected XML declaration for ${selector}`);
            assert(svg.includes('<svg xmlns="http://www.w3.org/2000/svg"'), `Expected standalone SVG root for ${selector}`);
            assert(svg.includes('<title id="export-title">'), `Expected SVG title for ${selector}`);
            assert(!svg.includes('var(--'), `Export contains unresolved CSS variables for ${selector}`);
            return { svg, filename: download.suggestedFilename() };
          };

          const mapCurrent = await downloadSvg('.realm-map-head [data-export-figure="map"][data-export-variant="current"]');
          assert(mapCurrent.svg.includes('Individual-country publications'), 'Current map SVG must describe the current map view');
          const mapPublication = await downloadSvg('.realm-map-head [data-export-figure="map"][data-export-variant="publication"]');
          assert(mapPublication.svg.includes('PUBLICATION SVG'), 'Publication map SVG must be explicitly publication-styled');
          assert(mapPublication.svg.includes('fill="#ffffff"'), 'Publication map SVG must use a white figure background');
          assert(mapPublication.svg.includes('papers-master.json#paper.year'), 'Publication map SVG must document the canonical year source');

          const annualPublication = await downloadSvg('.overview-chart [data-export-figure="annual"][data-export-variant="publication"]');
          assert(annualPublication.svg.includes('PUBLICATION SVG'), 'Publication annual SVG must be publication-styled');
          assert(annualPublication.svg.includes('2026'), 'Annual publication SVG must include the newest publication year');
          assert(annualPublication.svg.includes('Newest years are shown first'), 'Annual publication SVG must retain year-order guidance');

          await page.locator('.country-shape.has-source-data').first().click({ force: true });
          await page.waitForSelector('.country-heading h2');
          await page.waitForFunction(() => document.querySelectorAll('[data-realm-export-actions="annual"]').length === 2);
          assert(await page.locator('[data-realm-export-actions="annual"] [data-export-figure="annual"]').count() === 4, 'Country profile must expose two export modes on each annual chart');
          const countryAnnual = await downloadSvg('[data-realm-export-actions="annual"] [data-export-figure="annual"][data-export-variant="current"]');
          assert(countryAnnual.svg.includes('Annual publication counts and shares for') || countryAnnual.svg.includes('Annual international publication counts and shares for'), 'Country annual SVG must include its country-specific title');

          await page.locator('[data-realm-mode="cooperation"]').click();
          await page.waitForTimeout(150);
          const partnerMapId = await page.evaluate(() => {
            for (const path of document.querySelectorAll('.country-shape.has-source-data')) {
              const match = (path.getAttribute('aria-label') || '').match(/and (\d+) partner countries/);
              if (match && Number(match[1]) > 0) return path.dataset.mapId;
            }
            return '';
          });
          assert(partnerMapId, 'Expected at least one country with international partners');
          await page.locator(`[data-map-id="${partnerMapId}"]`).click({ force: true });
          await page.waitForSelector('.collaboration-line');
          const cooperationPublication = await downloadSvg('.realm-map-head [data-export-figure="map"][data-export-variant="publication"]');
          assert(cooperationPublication.svg.includes('collaboration-line'), 'Cooperation map SVG must include active collaboration connections');
          assert(cooperationPublication.svg.includes('International Cooperation'), 'Cooperation map SVG must record the active map mode');

          await page.setViewportSize({ width: 390, height: 844 });
          await page.goto(`${process.env.BASE_URL}/pinn-realm/`, { waitUntil: 'networkidle' });
          await page.waitForSelector('.country-shape.has-source-data');
          await page.waitForSelector('[data-realm-export-actions="annual"]');
          const mobile = await page.evaluate(() => {
            const mapSide = document.querySelector('.realm-map-head-side')?.getBoundingClientRect();
            const actions = document.querySelector('.chart-export-actions')?.getBoundingClientRect();
            return {
              viewport: window.innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              mapRight: mapSide?.right || 0,
              actionsRight: actions?.right || 0
            };
          });
          assert(mobile.documentWidth <= mobile.viewport + 1, `Unexpected mobile document overflow: ${mobile.documentWidth} > ${mobile.viewport}`);
          assert(mobile.mapRight <= mobile.viewport + 1, 'Map export controls overflow the mobile viewport');
          assert(mobile.actionsRight <= mobile.viewport + 1, 'Annual export controls overflow the mobile viewport');
          assert(pageErrors.length === 0, `Browser page errors: ${pageErrors.join(' | ')}`);
          await browser.close();
          console.log('PINN Realm SVG export browser QA passed.');
          NODE

      - name: Stop static preview
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/realm-svg-export-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/realm-export.js assets/realm.css pinn-realm/index.html
          git diff --cached --check
          git commit -m "feat: add SVG exports to PINN Realm figures"
          git push origin HEAD:feat/realm-svg-export
