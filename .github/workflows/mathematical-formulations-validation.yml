name: Mathematical formulations validation

on:
  pull_request:
    paths:
      - 'mathematical-formulations/**'
      - 'data/mathematical-formulations/**'
      - 'data/atlas-overview.json'
      - 'assets/mathematical-formulations.*'
      - 'assets/theme-init.js'
      - 'assets/home-refresh.js'
      - 'index.html'
      - 'scripts/validate-mathematical-formulations.mjs'
      - 'scripts/build-atlas-overview.mjs'
      - '.github/workflows/mathematical-formulations-validation.yml'
      - '.github/workflows/pages.yml'
  push:
    branches:
      - main
    paths:
      - 'mathematical-formulations/**'
      - 'data/mathematical-formulations/**'
      - 'data/atlas-overview.json'
      - 'assets/mathematical-formulations.*'
      - 'assets/theme-init.js'
      - 'assets/home-refresh.js'
      - 'index.html'
      - 'scripts/validate-mathematical-formulations.mjs'
      - 'scripts/build-atlas-overview.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-formulations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate formulation data and static contract
        run: |
          node --check assets/mathematical-formulations.js
          node scripts/build-atlas-overview.mjs --check
          node scripts/validate-mathematical-formulations.mjs
      - name: Locate runner browser
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_path"
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - name: Install browser driver
        run: npm install --prefix /tmp/pinn-formulations-qa --no-save --package-lock=false playwright-core@1.55.0
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinn-formulations-preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/mathematical-formulations/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pinn-formulations-preview.log
          exit 1
      - name: Validate formulation rendering and interactions
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CORE_PATH: /tmp/pinn-formulations-qa/node_modules/playwright-core/index.mjs
        run: node scripts/validate-mathematical-formulations.mjs --browser
      - name: Stop static preview
        if: always()
        run: kill "$PREVIEW_PID" 2>/dev/null || true
