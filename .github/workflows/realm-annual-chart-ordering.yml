name: Apply Realm annual chart ordering

on:
  push:
    branches:
      - fix/realm-annual-charts-newest-first
    paths:
      - .github/workflows/realm-annual-chart-ordering.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/realm-annual-charts-newest-first
          fetch-depth: 0

      - name: Update Realm annual chart ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/realm.js')
          text = path.read_text()

          old_years = "  const chartYears = () => state.year === 'all' ? state.data.metadata.years : [Number(state.year)];"
          new_years = "  const chartYears = () => state.year === 'all' ? [...state.data.metadata.years].sort((a, b) => b - a) : [Number(state.year)];"
          if old_years not in text:
              raise SystemExit('Expected chartYears source was not found')
          text = text.replace(old_years, new_years, 1)

          old_note = "</div></div><p class=\"annual-chart-note\"><strong>Amount</strong> above each bar · <strong>percentage</strong> below each year. ${escapeHtml(percentageMeaning)}.</p>`;"
          new_note = "</div></div><p class=\"annual-chart-note\"><strong>Amount</strong> above each bar · <strong>percentage</strong> below each year. ${escapeHtml(percentageMeaning)}. <strong>Newest years are shown first</strong>; scroll horizontally to explore older years.</p>`;"
          if old_note not in text:
              raise SystemExit('Expected annual chart note source was not found')
          text = text.replace(old_note, new_note, 1)

          path.write_text(text)
          PY

      - name: Run Realm checks
        run: |
          node --check assets/realm.js
          node scripts/validate-pinn-realm.mjs
          node scripts/validate-navigation.mjs
          node scripts/validate-dataset.mjs
          grep -F "Newest years are shown first" assets/realm.js
          grep -F "sort((a, b) => b - a)" assets/realm.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/realm-annual-chart-ordering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/realm.js
          git diff --cached --check
          git commit -m "fix: show newest Realm publication years first"
          git push origin HEAD:fix/realm-annual-charts-newest-first
